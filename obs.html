<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GRAND LINE · les alertes pour OBS · Barhaw</title>
<link rel="icon" href="/img/favicon-32.png" type="image/png">
<link rel="stylesheet" href="/polices/polices.css">
<script src="/obs.js" defer></script>
<style>
/* GRAND LINE dans le live : une page transparente à poser dans OBS (source navigateur), en 1920 × 1080 pour Twitch ou en
   1080 × 1920 pour TikTok. Rien ne s'affiche en dehors des alertes. Tout est dessiné sur une base de 1920 × 1080 (ou
   1080 × 1920 debout) : 1rem = 10 px de cette base, et la page suit la taille de la source. Le reste : obs.js. */
:root {
  --u: min(100vw / 1920, 100vh / 1080);
  --nuit: #1f0c1e; --prune: #2c1232; --creux: #3a1a3c;
  --rose: #ff4f9a; --rose-clair: #ff8fcb; --rose-fonce: #c2286e; --violet: #9b4dff; --violet-clair: #d1a6ff; --or: #ffcf5c;
  --blanc: #fff0f7; --brume: #e3c1d9; --ombre: #6f22c9; --papier: #fff2f8; --encre: #12050d; --prune-texte: #5a1d47;
  --titre: "Dela Gothic One", "M PLUS Rounded 1c", "Hiragino Sans", system-ui, sans-serif;
  --texte: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --rebond: cubic-bezier(0.2, 1.5, 0.4, 1);
}
@media (orientation: portrait) { :root { --u: min(100vw / 1080, 100vh / 1920); } }
html { font-size: calc(var(--u) * 10); }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body { font-family: var(--texte); font-weight: 700; color: var(--blanc); }
/* ?fond=oui : un fond sombre, pour régler la page dans un onglet (dans OBS elle reste transparente) */
body.fond { background: #1b1d26 repeating-conic-gradient(#20222c 0 25%, #1b1d26 0 50%) 0 0 / 8rem 8rem; }
#obs { position: fixed; inset: 0; }
.zone { position: absolute; left: 0; right: 0; top: 5.4rem; display: flex; justify-content: center; pointer-events: none; }
.place-milieu .zone { top: 0; bottom: 0; align-items: center; }
.place-bas .zone { top: auto; bottom: 6.6rem; }
@media (orientation: portrait) { .zone { top: 17rem; } .place-bas .zone { top: auto; bottom: 36rem; } }

/* ---------- une alerte : elle tombe d'en haut, rebondit, repart ---------- */
.al {
  box-sizing: border-box; display: flex; align-items: center; gap: 3.2rem; max-width: calc(100vw - 8rem); padding: 2.4rem 3.6rem 2.8rem;
  border: 0.5rem solid var(--encre); border-radius: 2.8rem; box-shadow: 1.1rem 1.2rem 0 var(--ombre);
  opacity: 0; transform: translateY(-140%) rotate(-3deg); transition: transform 0.65s var(--rebond), opacity 0.25s linear;
}
.place-bas .al { transform: translateY(140%) rotate(3deg); }
.al.entre { opacity: 1; transform: none; }
.al.sort { opacity: 0; transform: translateY(-50%) scale(0.96); transition: transform 0.4s ease-in, opacity 0.35s linear; }
.al-papier { background: var(--papier); color: var(--encre); }
.al-nuit { background: var(--nuit); color: var(--blanc); }
.al-texte { display: flex; flex-direction: column; gap: 0.6rem; min-width: 0; }
.al-sur { font-weight: 800; font-size: 2.6rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--rose-fonce); }
.al-nuit .al-sur { color: var(--rose-clair); }
.al-titre { font-family: var(--titre); font-weight: 400; font-size: 7.4rem; line-height: 1.05; text-shadow: 0.5rem 0.5rem 0 var(--rose-clair); }
.al-nuit .al-titre { text-shadow: 0.5rem 0.5rem 0 var(--rose-fonce); }
.al-titre.long { font-size: 5.4rem; text-shadow: 0.4rem 0.4rem 0 var(--rose-clair); }
.al-nuit .al-titre.long { text-shadow: 0.4rem 0.4rem 0 var(--rose-fonce); }
.al-nom { font-weight: 800; font-size: 4.4rem; line-height: 1.15; }
.al-info { font-size: 2.8rem; color: var(--prune-texte); }
.al-nuit .al-info { color: var(--brume); }
.al-image { position: relative; flex: none; width: 46rem; aspect-ratio: 16 / 9; border: 0.4rem solid var(--encre); border-radius: 1.8rem; overflow: hidden; background: #37b6cf; rotate: -2deg; box-shadow: 0.7rem 0.8rem 0 var(--rose); }
.al-image img, .choix-image img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.al-image.maquette img, .choix-image.maquette img { object-fit: contain; }
.al-emoji { flex: none; font-size: 14rem; line-height: 1; filter: drop-shadow(0.6rem 0.7rem 0 rgba(18, 5, 13, 0.35)); }
/* ---------- la mer en direct (?mer) : la course vue de haut, le top 5 ---------- */
.mer-obs { position: absolute; display: flex; align-items: flex-end; gap: 2rem; opacity: 0; transform: translateY(20%) scale(0.96); transition: transform 0.6s var(--rebond), opacity 0.3s linear; }
.mer-obs.entre { opacity: 1; transform: none; }
.mer-obs.coin-bas-gauche { left: 4rem; bottom: 4rem; }
.mer-obs.coin-bas-droite { right: 4rem; bottom: 4rem; flex-direction: row-reverse; }
.mer-obs.coin-haut-gauche { left: 4rem; top: 4rem; align-items: flex-start; }
.mer-obs.coin-haut-droite { right: 4rem; top: 4rem; align-items: flex-start; flex-direction: row-reverse; }
.mer-carte { position: relative; width: 64rem; aspect-ratio: 16 / 10; border: 0.5rem solid var(--encre); border-radius: 2.4rem; overflow: hidden; background: #e9dcc0; box-shadow: 1.1rem 1.2rem 0 var(--ombre); }
@media (orientation: portrait) { .mer-obs { flex-direction: column; align-items: flex-start; } .mer-obs.coin-bas-gauche, .mer-obs.coin-bas-droite { left: 4rem; right: auto; bottom: 26rem; flex-direction: column-reverse; } .mer-carte { width: 92rem; } }
.mer-toile { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.mer-etat { position: absolute; left: 1.4rem; top: 1.2rem; padding: 0.6rem 1.4rem; border-radius: 1.2rem; background: rgba(18, 5, 13, 0.78); color: #fff; font-size: 2.4rem; font-weight: 800; }
.mer-etat:empty { display: none; }
.mer-top { margin: 0; padding: 1.2rem 1.6rem; list-style: none; display: grid; gap: 0.5rem; min-width: 26rem; border: 0.4rem solid var(--encre); border-radius: 1.8rem; background: rgba(31, 12, 30, 0.92); color: #fff; font-size: 2.6rem; box-shadow: 0.8rem 0.9rem 0 var(--ombre); }
.mer-top[hidden] { display: none; }
.mer-top li { display: grid; grid-template-columns: 3rem minmax(0, 1fr); gap: 0.8rem; }
.mer-top li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 24rem; }
.mer-top li b { color: var(--or); font-family: var(--titre); font-weight: 400; }
.al-mer .al-nom { font-family: var(--titre); font-weight: 400; color: var(--or); }
.al-or .al-titre { text-shadow: 0.5rem 0.5rem 0 var(--or); }
.al-or .al-image { box-shadow: 0.7rem 0.8rem 0 var(--or); }

/* ---------- les jauges ---------- */
.jauge { height: 2.4rem; background: var(--creux); border: 0.3rem solid var(--encre); border-radius: 99rem; overflow: hidden; }
.jauge i { display: block; height: 100%; width: 0; background: var(--rose); transition: width 0.6s ease-out; }
.jauge.grande { height: 3.2rem; border-width: 0.4rem; }
.jauge.rage i { background: #ff2d55; }
.pastille { align-self: flex-start; font-family: var(--titre); font-weight: 400; font-size: 4rem; line-height: 1.1; color: #fff; background: var(--violet); border: 0.4rem solid var(--encre); border-radius: 99rem; padding: 0.8rem 2.8rem 1.2rem; }
.pastille.rose { font-family: var(--texte); font-weight: 800; font-size: 3rem; color: var(--encre); background: var(--rose); padding: 0.6rem 2rem; }

/* ---------- le vote du carrefour ---------- */
.vote { flex-direction: column; align-items: stretch; gap: 2rem; width: 124rem; }
.vote-tete { display: flex; align-items: center; justify-content: space-between; gap: 2rem; }
.vote-temps { font-weight: 800; font-size: 3.2rem; white-space: nowrap; }
.vote-choix { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 2.2rem; }
.choix { display: flex; flex-direction: column; background: var(--prune); border: 0.4rem solid var(--encre); border-radius: 1.8rem; overflow: hidden; }
.choix-image { position: relative; flex: none; aspect-ratio: 16 / 9; overflow: hidden; background: #37b6cf; }
.choix-corps { display: flex; flex-direction: column; gap: 1rem; padding: 1.4rem 2rem 1.8rem; }
.choix-ligne { display: flex; align-items: baseline; justify-content: space-between; gap: 1.4rem; }
.choix-nom { font-weight: 800; font-size: 3.2rem; line-height: 1.15; }
.choix-pct { font-family: var(--titre); font-weight: 400; font-size: 3.6rem; white-space: nowrap; }
.choix:nth-child(2) .jauge i { background: var(--violet-clair); }
.choix:nth-child(3) .jauge i { background: var(--or); }
.vote-pied { font-size: 2.8rem; color: var(--brume); }
/* le rappel : la même chose en petit (une vignette à côté du nom) */
.vote.rappel { gap: 1.6rem; padding: 2rem 3rem 2.2rem; }
.vote.rappel .pastille { font-size: 3.2rem; padding: 0.6rem 2.4rem 0.9rem; }
.vote.rappel .choix { flex-direction: row; align-items: stretch; }
.vote.rappel .choix-image { flex: none; width: 16rem; aspect-ratio: 16 / 9; }
.vote.rappel .choix-nom { font-size: 2.8rem; }
.vote.rappel .choix-pct { font-size: 3rem; }
.vote.rappel .trois .choix-image { display: none; } /* à trois, en large : pas la place */
.vote.rappel .choix-corps { flex: 1; min-width: 0; justify-content: center; padding: 1rem 1.8rem 1.2rem; }
.trois .choix-nom { font-size: 2.8rem; }

/* ---------- le BOSS LIVE ---------- */
.boss { gap: 2.6rem; width: 124rem; }
.boss-image { flex: none; width: 38rem; height: 40rem; object-fit: contain; filter: drop-shadow(0.8rem 0.9rem 0 rgba(18, 5, 13, 0.5)); }
.boss-corps { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1.4rem; }
.boss-nom { font-family: var(--titre); font-weight: 400; font-size: 9.6rem; line-height: 1; text-shadow: 0.6rem 0.6rem 0 var(--rose-fonce); }
.boss-titre { font-weight: 800; font-size: 3.4rem; color: var(--rose-clair); }
.boss-vie { display: flex; align-items: baseline; justify-content: space-between; gap: 2rem; font-weight: 800; font-size: 3rem; }
.boss-vie b { font-family: var(--titre); font-weight: 400; font-size: 3.4rem; color: var(--rose-clair); }
.boss .al-info + .al-info { margin-top: -0.8rem; }
.boss.fin .boss-image { width: 30rem; height: 30rem; }
.boss.fin .al-titre { font-size: 5rem; }

/* ---------- la barre : pendant le combat, avant la sortie ---------- */
.barre {
  box-sizing: border-box; display: flex; align-items: center; gap: 1.8rem; padding: 1rem 2.6rem 1rem 1.4rem; background: var(--nuit);
  border: 0.4rem solid var(--encre); border-radius: 99rem; box-shadow: 0.7rem 0.8rem 0 var(--ombre);
  opacity: 0; transform: translateY(-160%); transition: transform 0.5s var(--rebond), opacity 0.2s linear;
}
.place-bas .barre { transform: translateY(160%); }
.barre.entre { opacity: 1; transform: none; }
.barre img { flex: none; width: 7.4rem; height: 7.4rem; object-fit: contain; }
.barre-nom { font-family: var(--titre); font-weight: 400; font-size: 3.4rem; line-height: 1.1; white-space: nowrap; }
.barre .jauge { flex: none; width: 46rem; }
.barre-temps { font-family: var(--titre); font-weight: 400; font-size: 3.6rem; color: var(--rose-clair); min-width: 10rem; text-align: right; font-variant-numeric: tabular-nums; }
.barre.attente { padding-left: 2.8rem; }

/* ---------- la Guerre des commus : avant la bataille, ses résultats, la commu qui règne ---------- */
.guerre .al-sur { color: #ffb347; }
.al-papier.guerre .al-sur { color: #b0610a; }
.guerre.resultats { width: 124rem; }
.guerre.resultats .al-texte { flex: 1; }
.gu-lignes { display: flex; flex-direction: column; gap: 0.5rem; margin: 0.4rem 0 0; padding: 0; list-style: none; font-size: 3.2rem; line-height: 1.25; }
.gu-lignes li.prise { font-weight: 800; }
.al-nuit .gu-lignes li.prise { color: var(--or); }
.guerre.regne .al-nom { font-size: 3.4rem; }
.barre.guerre .barre-nom { color: #ffd9a8; }
.barre.guerre.rage { padding-right: 2.8rem; border-color: #ff7a3a; animation: rage 0.9s ease-in-out infinite alternate; }
@keyframes rage { from { box-shadow: 0.7rem 0.8rem 0 var(--ombre), 0 0 0 0 rgba(255, 122, 58, 0); } to { box-shadow: 0.7rem 0.8rem 0 var(--ombre), 0 0 3rem 0.6rem rgba(255, 122, 58, 0.55); } }

/* ---------- la sortie de la VF 1.0 ---------- */
.zone-compte { top: 0; bottom: 0; align-items: center; }
.compte { font-family: var(--titre); font-size: 34rem; line-height: 1; color: var(--papier); -webkit-text-stroke: 1rem var(--encre); paint-order: stroke fill; text-shadow: 1.4rem 1.5rem 0 var(--ombre); animation: tic 1s var(--rebond) both; }
@keyframes tic { from { transform: scale(1.7) rotate(-6deg); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }
.sortie { flex-direction: column; gap: 1.2rem; text-align: center; padding: 3.2rem 6rem 4rem; }
.sortie-vf { font-family: var(--titre); font-weight: 400; font-size: 17rem; line-height: 1; color: var(--rose); -webkit-text-stroke: 0.5rem var(--encre); paint-order: stroke fill; text-shadow: 0.9rem 0.9rem 0 var(--violet), 1.4rem 1.4rem 0 var(--encre); }
.sortie-titre { font-family: var(--titre); font-weight: 400; font-size: 8rem; line-height: 1.05; }
.sortie-ligne { font-weight: 800; font-size: 3.6rem; color: var(--prune-texte); }
.sortie-site { align-self: center; margin-top: 1rem; font-weight: 800; font-size: 3.4rem; background: var(--encre); color: var(--papier); padding: 0.8rem 2.8rem 1rem; border-radius: 99rem; }

/* ---------- debout (TikTok) : tout s'empile ---------- */
@media (orientation: portrait) {
  .al { flex-direction: column; align-items: stretch; text-align: center; gap: 2.4rem; width: 100rem; max-width: calc(100vw - 6rem); padding: 2.6rem 3rem 3rem; }
  .al-image { width: 100%; rotate: none; }
  .al-titre { font-size: 6.4rem; }
  .al-titre.long { font-size: 5rem; }
  .al-emoji { align-self: center; }
  .pastille { align-self: center; }
  .vote, .boss { width: 100rem; }
  .vote { text-align: left; }
  .vote-tete { flex-direction: column; align-items: center; gap: 1rem; }
  .vote-choix { grid-template-columns: minmax(0, 1fr); gap: 1.6rem; }
  .choix { flex-direction: row; align-items: stretch; }
  .choix-image { width: 34rem; }
  .vote.rappel .trois .choix-image { display: block; }
  .choix-corps { flex: 1; min-width: 0; justify-content: center; }
  .vote-pied { text-align: center; }
  .boss-image { align-self: center; width: 46rem; height: 46rem; }
  .boss.fin .boss-image { width: 38rem; height: 38rem; }
  .boss-vie { text-align: left; }
  .barre { max-width: calc(100vw - 6rem); }
  .barre .jauge { width: 30rem; }
  .guerre.resultats { width: 100rem; }
  .gu-lignes { text-align: left; font-size: 3rem; }
  .sortie-vf { font-size: 15rem; }
  .sortie-titre { font-size: 7rem; }
  .compte { font-size: 40rem; }
}
/* ---------- les vidéos du chat (?video, js/obs-video.js) : la vidéo, et une carte « la vidéo de @… » ----------
   Tout se mesure en em : 1em = 1rem au milieu de l'écran, un peu moins dans un coin (--k). */
.vid { --k: 1; position: absolute; display: flex; flex-direction: column; align-items: center; gap: 1.6em; width: 112em; font-size: calc(var(--k) * 1rem); color: var(--encre); pointer-events: none;
  opacity: 0; transform: translateY(3rem) scale(0.94) rotate(-1.2deg); transition: transform 0.6s var(--rebond), opacity 0.3s linear; }
.vid.entre { opacity: 1; transform: none; }
.vid.sort { opacity: 0; transform: scale(0.97); transition: transform 0.4s ease-in, opacity 0.35s linear; }
.vid.coin-centre { left: 50%; top: 50%; translate: -50% -50%; }
.vid.coin-haut-gauche, .vid.coin-haut-droite, .vid.coin-bas-gauche, .vid.coin-bas-droite { --k: 0.6; }
.vid.coin-haut-gauche { left: 4rem; top: 4rem; }
.vid.coin-haut-droite { right: 4rem; top: 4rem; }
.vid.coin-bas-gauche { left: 4rem; bottom: 4rem; }
.vid.coin-bas-droite { right: 4rem; bottom: 4rem; }
.vid-cadre { position: relative; width: calc(100% - 1.2em); aspect-ratio: 16 / 9; background: #000; border: 0.6em solid var(--encre); border-radius: 2.4em; overflow: hidden; box-shadow: 1.1em 1.2em 0 var(--ombre); }
.vid-cadre iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.vid-cote { display: flex; flex-direction: column; align-items: center; gap: 1.4em; width: 100%; }
.vid-info { box-sizing: border-box; width: 100%; padding: 1.3em 2.4em 1.6em; background: var(--papier); border: 0.5em solid var(--encre); border-radius: 2em; box-shadow: 0.8em 0.9em 0 var(--rose); rotate: -0.5deg; }
.vid-haut { display: flex; align-items: center; gap: 1.2em; }
.vid-clap { flex: none; font-size: 3.6em; line-height: 1; }
.vid-qui { flex: 1; min-width: 0; font-family: var(--titre); font-weight: 400; font-size: 4em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0.08em 0.08em 0 var(--rose-clair); }
.vid-temps { flex: none; min-width: 2.6em; text-align: right; font-family: var(--titre); font-weight: 400; font-size: 3.8em; line-height: 1; color: var(--rose-fonce); }
.vid-titre { margin-top: 0.3em; font-weight: 800; font-size: 2.9em; line-height: 1.22; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.vid-auteur { margin-top: 0.35em; font-size: 2.3em; color: var(--prune-texte); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vid-site { display: inline-block; margin-right: 0.25em; padding: 0.08em 0.6em 0.16em; border-radius: 99em; font-size: 0.82em; font-weight: 800; color: #fff; background: #e1251b; vertical-align: 0.08em; }
.vid-site.tiktok { background: var(--encre); box-shadow: -0.14em 0 0 #25f4ee, 0.14em 0 0 #fe2c55; }
.vid-jauge { height: 1.5em; margin-top: 0.9em; background: #f6d3e6; border: 0.3em solid var(--encre); border-radius: 99em; overflow: hidden; }
.vid-jauge i { display: block; width: 0; height: 100%; background: linear-gradient(90deg, var(--rose), var(--violet)); transition: width 0.2s linear; }
.vid-note { display: inline-block; margin-top: 0.8em; padding: 0.2em 0.8em 0.3em; font-size: 2.2em; background: var(--or); border: 0.12em solid var(--encre); border-radius: 99em; }
.vid-note[hidden] { display: none; }
.vid-pied { font-size: 2.4em; color: var(--blanc); background: var(--nuit); border: 0.17em solid var(--encre); border-radius: 99em; padding: 0.25em 0.9em 0.35em; box-shadow: 0.15em 0.18em 0 var(--ombre); white-space: nowrap; }
.vid-pied b { color: var(--or); white-space: nowrap; }
.vid-file { color: var(--brume); white-space: nowrap; }
/* debout (TikTok, Shorts) : la vidéo comme sur le téléphone, la carte à côté (le lecteur TikTok veut au moins 325 × 578) */
.vid.vertical { flex-direction: row; align-items: flex-end; gap: 3em; width: auto; }
.vid.vertical .vid-cadre { flex: none; width: 46em; min-width: 325px; aspect-ratio: 9 / 16; }
/* la vidéo seule (sans ?infos=oui) : rien à côté ; le mot pour le son (hors d'OBS) passe par-dessus la vidéo */
.vid.seule.vertical { gap: 0; }
.vid-cadre > .vid-note { position: absolute; left: 50%; bottom: 1.4em; z-index: 2; margin: 0; transform: translateX(-50%); white-space: nowrap; }
.vid.vertical .vid-cote { width: 64em; align-items: flex-start; }
.vid.vertical .vid-haut { align-items: flex-start; }
.vid.vertical .vid-qui { font-size: 3.6em; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.vid.vertical .vid-pied { max-width: 100%; box-sizing: border-box; white-space: normal; border-radius: 1em; }
.vid.vertical.coin-haut-droite, .vid.vertical.coin-bas-droite { flex-direction: row-reverse; }
.vid.vertical.coin-haut-gauche, .vid.vertical.coin-haut-droite { align-items: flex-start; }
.vid.vertical .vid-titre { -webkit-line-clamp: 3; }
/* ?essai=video : une fausse vidéo */
.vid-faux { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2em; color: #fff; background: linear-gradient(160deg, #2a0f3a, #c2286e 55%, #ffcf5c); background-size: 220% 220%; animation: vid-faux 6s ease-in-out infinite alternate; }
.vid-faux.tiktok { background-image: linear-gradient(200deg, #101018, #3a1a3c 45%, #25c6d9); }
.vid-faux-icone { font-size: 12em; line-height: 1; animation: vid-pouls 1.4s ease-in-out infinite; }
.vid-faux-texte { font-family: var(--titre); font-size: 4.4em; text-shadow: 0.08em 0.08em 0 var(--encre); }
@keyframes vid-faux { to { background-position: 100% 100%; } }
@keyframes vid-pouls { 50% { transform: scale(1.08); } }
/* une vidéo qui ne passe pas : la carte le dit quelques secondes */
